<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b14" />
    <title>Sin conexión · FitTracker</title>
    <style>
      :root { --bg: #090b14; --fg: #f3f4fb; --sub: #8a90ad; --a1: #7c5cff; --a2: #2e8bff; color-scheme: dark; }
      @media (prefers-color-scheme: light) { :root { --bg: #f1f3fa; --fg: #121430; --sub: #666c8c; color-scheme: light; } }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
      main { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .logo { width: 64px; height: 64px; border-radius: 22px; background: linear-gradient(135deg, var(--a1), var(--a2)); }
      h1 { margin: 6px 0 0; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--sub); line-height: 1.55; font-size: 15px; }
      a, button { margin-top: 8px; height: 50px; padding: 0 22px; border: 0; border-radius: 17px; font-weight: 600; font-size: 15px; font-family: inherit;
        color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); display: inline-flex; align-items: center; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true"></div>
      <h1>Sin conexión</h1>
      <p>Esta pantalla no estaba guardada en tu teléfono. Si tienes una sesión en curso, puedes seguir registrándola: se sube sola cuando vuelva la señal.</p>
      <a href="/sesion" id="resume" hidden>Continuar mi sesión</a>
      <button onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      try {
        var id = localStorage.getItem("ft-active");
        if (id) { var a = document.getElementById("resume"); a.href = "/sesion?id=" + id; a.hidden = false; }
      } catch (e) {}
    </script>
  </body>
</html>
